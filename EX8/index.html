<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { border: 1px solid #ccc; padding: 20px; width: 300px; }
        input[type="text"], input[type="email"], input[type="number"] { width: 90%; padding: 8px; margin: 10px 0; }
        input[type="submit"] { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>User Registration</h2>
    <div class="form-container">
        <form action="display.jsp" method="POST">
            <label>Name:</label>
            <input type="text" name="uname" required>
            
            <label>Email:</label>
            <input type="email" name="email" required>
            
            <label>Age:</label>
            <input type="number" name="age" required>
            
            <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female" required> Female<br><br>
            
            <label>Course:</label><br>
            <select name="course">
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="B.Tech IT">B.Tech IT</option>
                <option value="B.Tech ECE">B.Tech ECE</option>
            </select><br><br>

            <input type="submit" value="Register Now">
        </form>
    </div>
</body>
</html>
