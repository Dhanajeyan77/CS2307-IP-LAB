<!DOCTYPE html>
<html lang="en">
<head>
<title>Modern Login Portal</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale $=1.0^{\prime\prime}>$
<style>
body {
background: linear-gradient(135deg, #74b9ff, #0984e3);
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.login-card {
background: white;
padding: 40px;
border-radius: 12px;
box-shadow: 0 10px 25px rgba(0,0,0,0.15);
width: 100%;
max-width: 360px;
box-sizing: border-box;
}
.login-card h2 {
margin-top: 0;
margin-bottom: 24px;
color: #2d3436;
text-align: center;
}
.form-group {
margin-bottom: 20px;
}
.form-group label {
display: block;
margin-bottom: 8px;
color: #636e72;
font-size: 14px;
font-weight: 600;
}
.form-group input {
width: 100%;
padding: 12px;
border: 1px solid #dfe6e9;
border-radius: 6px;
font-size: 15px;
box-sizing: border-box;
transition: border-color 0.2s;
}
.form-group input:focus {
outline: none;
border-color: #0984e3;
}
.btn-submit {
width: 100%;
padding: 12px;
background-color: #0984e3;
border: none;
border-radius: 6px;
color: white;
font-size: 16px;
font-weight: bold;
cursor: pointer;
transition: background 0.2s;
}
.btn-submit:hover {
background-color: #0b7dda;
}
</style>
</head>
<body>
<div class="login-card">
<h2>Account Login</h2>
<form action="NewServlet" method="POST">
<!-- Session Tracking: Hidden Form Field -->
<input type="hidden" name="sessionStatus" value="active">
<div class="form-group">
<label>Username</label>
<input type="text" name $=^{\prime\prime}n^{\prime\prime}$ placeholder="Enter your username" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" name $=^{\prime\prime}p^{\prime\prime}$ placeholder="Enter your password" required>
</div>
<button type="submit" class="btn-submit">Login</button>
</form>
</div>
</body>
</html>
