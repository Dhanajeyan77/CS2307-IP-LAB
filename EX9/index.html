<!DOCTYPE html>
<html>
<head>
    <title>Online Order System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .order-container { border: 1px solid #ccc; padding: 20px; width: 350px; background-color: #f9f9f9; }
        input[type="text"], input[type="number"] { width: 90%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; }
        input[type="submit"] { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; width: 95%; }
    </style>
</head>
<body>
    <h2>Place an Online Order</h2>
    <div class="order-container">
        <form action="processOrder.jsp" method="POST">
            <label>Customer Name:</label>
            <input type="text" name="customerName" required>
            
            <label>Product Name:</label>
            <input type="text" name="productName" required>
            
            <label>Quantity:</label>
            <input type="number" name="quantity" required>
            
            <label>Total Price (in Rs):</label>
            <input type="number" step="0.01" name="price" required>
            
            <input type="submit" value="Submit Order">
        </form>
    </div>
</body>
</html>
