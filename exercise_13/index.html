<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Shopping - AJAX & XML</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function loadProducts() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    displayProducts(this);
                }
            };
            xhr.open("GET", "products.xml", true);
            xhr.send();
        }

        function displayProducts(xml) {
            var i;
            var xmlDoc = xml.responseXML;
            var container = document.getElementById("product-list");
            container.innerHTML = "";
            
            var x = xmlDoc.getElementsByTagName("product");
            
            for (i = 0; i < x.length; i++) { 
                var name = x[i].getElementsByTagName("name")[0].childNodes[0].nodeValue;
                var desc = x[i].getElementsByTagName("description")[0].childNodes[0].nodeValue;
                var price = x[i].getElementsByTagName("price")[0].childNodes[0].nodeValue;
                
                var card = document.createElement("div");
                card.className = "product-card";
                
                var nameDiv = document.createElement("div");
                nameDiv.className = "product-name";
                nameDiv.innerHTML = name;
                
                var descP = document.createElement("p");
                descP.className = "product-desc";
                descP.innerHTML = desc;
                
                var priceDiv = document.createElement("div");
                priceDiv.className = "product-price";
                priceDiv.innerHTML = "$" + parseFloat(price).toFixed(2);
                
                card.appendChild(nameDiv);
                card.appendChild(descP);
                card.appendChild(priceDiv);
                
                container.appendChild(card);
            }
        }
    </script>
</head>
<body>

    <div class="header-container">
        <h1>Online Shopping Store</h1>
        <p>Experience seamless browsing. Load products asynchronously using AJAX and XML.</p>
        <button type="button" onclick="loadProducts()">Load Products Now</button>
    </div>

    <div id="product-list">
    </div>

</body>
</html>
